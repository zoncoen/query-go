name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  query:
    strategy:
      matrix:
        go-version: [stable, oldstable]
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Test
      run: go test -race ./... -coverpkg=./... -coverprofile=coverage.out -covermode=atomic
    - uses: actions/upload-artifact@v7
      if: startsWith(matrix.go-version, 'stable')
      with:
        name: query-coverage-report
        path: ./coverage.out

  query-extractor-yaml:
    strategy:
      matrix:
        go-version: [stable, oldstable]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extractor/yaml
    steps:
    - name: Install Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Resolve the root module locally
      working-directory: ${{ github.workspace }}
      run: |
        go work init ./extractor/yaml ./extractor/protobuf
        go work edit -replace github.com/zoncoen/query-go/v2=.
    - name: Test
      run: go test -race ./... -coverpkg=./... -coverprofile=coverage.out -covermode=atomic
    - uses: actions/upload-artifact@v7
      if: startsWith(matrix.go-version, 'stable')
      with:
        name: query-extractor-yaml-coverage-report
        path: ./extractor/yaml/coverage.out

  query-extractor-protobuf:
    strategy:
      matrix:
        go-version: [stable, oldstable]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extractor/protobuf
    steps:
    - name: Install Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Resolve the root module locally
      working-directory: ${{ github.workspace }}
      run: |
        go work init ./extractor/yaml ./extractor/protobuf
        go work edit -replace github.com/zoncoen/query-go/v2=.
    - name: Test
      run: go test -race ./... -coverpkg=./... -coverprofile=coverage.out -covermode=atomic
    - uses: actions/upload-artifact@v7
      if: startsWith(matrix.go-version, 'stable')
      with:
        name: query-extractor-protobuf-coverage-report
        path: ./extractor/protobuf/coverage.out

  collect-metrics:
    name: collect metrics
    needs:
      - query
      - query-extractor-yaml
      - query-extractor-protobuf
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: query-coverage-report
        path: .
    - uses: actions/download-artifact@v8
      with:
        name: query-extractor-yaml-coverage-report
        path: ./extractor/yaml
    - uses: actions/download-artifact@v8
      with:
        name: query-extractor-protobuf-coverage-report
        path: ./extractor/protobuf
    - uses: k1LoW/octocov-action@v1

  lint:
    strategy:
      matrix:
        dir: [".", "extractor/yaml", "extractor/protobuf"]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: stable
    - name: Resolve the root module locally
      if: matrix.dir != '.'
      run: |
        go work init ./extractor/yaml ./extractor/protobuf
        go work edit -replace github.com/zoncoen/query-go/v2=.
    - name: gofmt
      working-directory: ${{ matrix.dir }}
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "the following files are not gofmt-ed:"
          echo "$unformatted"
          exit 1
        fi
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        working-directory: ${{ matrix.dir }}
